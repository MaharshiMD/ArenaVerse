apiVersion: apps/v1
kind: Deployment
metadata:
  name: arenaverse-backend-deployment
  labels:
    app: arenaverse-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: arenaverse-backend
  template:
    metadata:
      labels:
        app: arenaverse-backend
    spec:
      containers:
      - name: arenaverse-backend
        image: arenaverse/backend:latest
        ports:
        - containerPort: 5000
        env:
        - name: PORT
          value: "5000"
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: arenaverse-secrets
              key: mongo-uri
---
apiVersion: v1
kind: Service
metadata:
  name: arenaverse-backend-service
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
  selector:
    app: arenaverse-backend

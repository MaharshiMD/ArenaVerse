version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: arenaverse-mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arenaverse-backend
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/arena_verse
      - JWT_SECRET=arenaverse_production_secret
    depends_on:
      - mongodb

volumes:
  mongo-data:
